openapi: 3.0.3
info:
  title: Discord REST test surface
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4010
paths:
  /v10/guilds/{guildId}/roles:
    get:
      operationId: listGuildRoles
      parameters:
        - name: guildId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Guild roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
              example:
                - id: mh-notification-role
                  name: モンハン募集通知
  /v10/channels/{channelId}/messages:
    post:
      operationId: createChannelMessage
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Created message
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
              example: { id: hunt-message }
  /v10/webhooks/{applicationId}/{token}/messages/@original:
    patch:
      operationId: updateOriginalInteraction
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated interaction response
          content:
            application/json:
              schema:
                type: object
              example: {}
